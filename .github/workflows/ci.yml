name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
          # The sample has no external dependencies or go.sum.
          cache-dependency-path: go.mod

      - name: Print event and revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf 'github.event_name=%s\n' "$EVENT_NAME"
          printf 'github.ref=%s\n' "$REF"
          printf 'github.sha=%s\n' "$SHA"
          printf 'github.event.pull_request.head.sha=%s\n' "$PR_HEAD_SHA"

      - name: Check formatting
        run: make fmt-check

      - name: Go vet
        run: make vet

      - name: Test
        run: make test

      - name: Package main build and print checksums
        if: github.event_name == 'push'
        env:
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
        run: |
          make package VERSION=0.0.0-main \
            BUILD_NO="$BUILD_NO" RUN_ID="$RUN_ID" COMMIT="$COMMIT"
          sha256sum \
            dist/enroll-conflict_0.0.0-main_linux_amd64/enroll-conflict \
            dist/enroll-conflict_0.0.0-main_linux_amd64.tar.gz

      - name: Upload main build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          # Keep artifacts from repeated attempts of the same run separately.
          name: enroll-conflict-${{ github.sha }}-build-${{ github.run_number }}-attempt-${{ github.run_attempt }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14
